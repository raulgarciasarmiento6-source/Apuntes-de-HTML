<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tipos de Inputs</h1>
    <form action="procesa.php">
    <fieldset>
        <legend>Datos Personales</legend>
    <p>
        <label for="nom">Nombre:</label>
        <input type="text" maxlength="6" 
        name="Nombre" 
        id="nom">    
    </p>
    <p>
        <label for="pas">Contraseña</label>
        <input type="password" maxlength="12" 
        name="Contraseña" 
        id="pas">    
    </p>

    <p>
        <label for="Hombre:">Hombre:</label>
        <input type="radio" value="H"
        checked id="hombre" name="g">


        <label for="Mujer:">Mujer:</label>
        <input type="radio" value="M"
        checked id="Mujer" name="g">


        <label for="Prefiero no decirlo:">Prefiero no decirlo:</label>
        <input type="radio" value="p"
        checked id="Prefiero no decirlo" name="g">


    </p>
    <p>
        <label for="fuma">Fumador</label>
            <input type="checkbox" name="umador" id="Fumador">
            
        </p>

</fieldset>
<p>
    <label for="prov">Provincia:</label>
    <select name="prov" id="prov">

        <option value="cr">Ciudad Real</option>
        <option value="Al">Albacete</option>
        <option value="Mu">Murcia</option>
        <option value="Ca">Cádiz</option>
        <option value="To" selected>Toledo</option>

    </select>
    <p>
        <label for="Obs">Observaciones</label>
        <textarea name="Obs" 
        cols="10" rows="6"
        id="Obs">
        </textarea>
    </p>

    <p>
        <label for="color">Color:</label>
        <input type="color" name="color"
        id="color">

        <label for="Fecha-de-nac">Fecha de Nacimiento</label>
        <input type="date" name="Fecha-de-nac"
        id="Fecha-de-nac">

        <label for="edad">Edad:</label>
        <input type="number" name="edad"
        id="edad" min="0" max="110">

        <label for="mail">Email:</label>
        <input type="email" name="mail"
        id="mail" >

        <label for="foto">Adjuntar foto:</label>
        <input type="file" name="foto"
        id="foto" >
    </p>

</p>
<!--Botones de enío y reset-->

<p>

<input type="submit" value="Enviar">
<input type="reset" value="Reiniciar formulario"

</p>
</form>
</body>
</html>
